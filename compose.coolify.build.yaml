# Build-job resource: no ports, volumes, or recorder process.
# Coolify custom build command: docker compose build
# Coolify custom start command: sh docker/publish-image.sh
services:
  image:
    image: ${RAADIO_IMAGE_REPOSITORY:?Set the private registry repository in Coolify}:${SOURCE_COMMIT:?Coolify must provide the source commit}
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.source: https://github.com/riffmasta/raadio
        org.opencontainers.image.revision: ${SOURCE_COMMIT:?}
    entrypoint: ["true"]
    restart: "no"
    healthcheck:
      disable: true
